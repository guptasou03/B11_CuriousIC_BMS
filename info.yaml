project:
  title: "Battery Management System"             # Project title (e.g. "Simple CPU", "PLL", "ADC")
  team: "B11 CuriousIC"                      # Your Team name
  discord: "darshanshet2004"                   # Optional: Discord username (for support / communication)
  description: "A design of battery management system AFE comprising of instrumentaion amplifiers, data converters and choppers"  # Short one-line description
  lvs_config: "$UPRJ_ROOT/lvs_config.json"
  gf_def_ready: true            # data ready for def generation with global foundries' pad frame
  ws_def_ready: true            # data ready for def generation with wafer space pad frame
  drc_ready: true               # data ready for integration and DRC
  lvs_ready: true               # data ready for integrated LVS

# There are 7 i/o pin types and the associated connections from the user area to the i/o pad cell
# all control signals must be connected
# ground: 
#   <name> connects to DVSS
# power: 
#   <name> connects to DVDD
# input_cmos: digital input with no hysteresis
#   <name> connects to Y
#   control pins:
#     <name_PD>: connects to PD. weak pull down when enabled
#     <name_PU>: connects to PU. weak pull up when enabled
# input_schmitt: digital input with hysteresis
#   <name> connects to Y
#   control pins:
#     <name_PD>: connects to PD. weak pull down when enabled
#     <name_PU>: connects to PU. weak pull up when enabled
# bidirectional: programmable drive strength PDRV[1:0] - 00: 4mA, 01: 8mA, 10: 12mA, 11: 16mA
#   <name>_IN connects to Y
#   <name>_OUT connects to A
#   control pins:
#     <name_PD>: connects to PD. weak pull down when enabled
#     <name_PU>: connects to PU. weak pull up when enabled
#     <name_CS>: input type - low is cmos buffer, high is schmitt trigger
#     <name_SL>: output slew rate - low is fast, high is slow
#     <name_IE>: input enable - high for input PAD -> Y
#     <name_OE>: output enable - high for output A -> PAD
#     <name_PDRV0>: drive strength lsb
#     <name_PDRV1>: drive strength msb
# bidirectional_24ma: fixed drive strength 24mA
#   <name>_IN connects to Y
#   <name>_OUT connects to A
#   control pins:
#     <name_PD>: connects to PD. weak pull down when enabled
#     <name_PU>: connects to PU. weak pull up when enabled
#     <name_CS>: input type - low is cmos buffer, high is schmitt trigger
#     <name_SL>: output slew rate - low is fast, high is slow
#     <name_IE>: input enable - high for input PAD -> Y
#     <name_OE>: output enable - high for output A -> PAD
# analog:
#   <name> connects to ASIG5V
#   Note: secondary_esd flag is ignored

pins:
  - name: B11_BMS_DVSS
    io_type: ground
  - name: B11_BMS_CLKIN
    io_type: input_cmos
  - name: B11_BMS_CLK_FCHOP
    io_type: input_cmos
  - name: B11_BMS_DVDD
    io_type: power
  - name: B11_BMS_VINN_CH1
    io_type: analog
    secondary_esd: false
  - name: B11_BMS_VINP_CH1
    io_type: analog
    secondary_esd: false
  - name: B11_BMS_VREFP
    io_type: analog
    secondary_esd: false
  - name: B11_BMS_IBIAS_5u
    io_type: analog
    secondary_esd: false
  - name: B11_BMS_VCM
    io_type: analog
    secondary_esd: false
  - name: B11_BMS_VINN_CH2
    io_type: bidirectional
  - name: B11_BMS_VINP_CH2
    io_type: bidirectional
  - name: B11_BMS_EN_EIS
    io_type: input_cmos
  - name: B11_BMS_EIS_RESET
    io_type: input_cmos
  - name: B11_BMS_AVSS
    io_type: ground
  - name: B11_BMS_AVDD
    io_type: power
  - name: B11_BMS_CH_SEL
    io_type: input_cmos
  - name: B11_BMS_ATB_SEL_0
    io_type: input_cmos
  - name: B11_BMS_ATB_SEL_1
    io_type: input_cmos
  - name: B11_BMS_D_EIS
    io_type: input_cmos
  - name: B11_BMS_CLK_EIS
    io_type: input_cmos
  - name: B11_BMS_ATB_IA_ADC
    io_type: analog
    secondary_esd: false
  - name: B11_BMS_DOUT
    io_type: input_cmos
  
